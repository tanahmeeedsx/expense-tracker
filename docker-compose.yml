name: expense-tracker

# ---- shared settings (YAML anchors) ----
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # stop container logs from filling the EC2 disk
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  # ---------------- MongoDB ----------------
  mongo:
    <<: *common
    image: mongo:7.0
    container_name: expense-mongo
    # keep WiredTiger small enough for a 2 GB instance
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-expense_tracker}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    networks:
      - backend_net            # private network only - no port published to the host
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  # ---------------- Backend API ----------------
  backend:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: expense-tracker-backend:${APP_TAG:-latest}
    container_name: expense-backend
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-expense_tracker}?authSource=${MONGO_DB:-expense_tracker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 200

  # ---------------- Frontend (NGINX) ----------------
  frontend:
    <<: *common
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: expense-tracker-frontend:${APP_TAG:-latest}
    container_name: expense-frontend
    ports:
      - "${HTTP_PORT:-80}:8080"   # the ONLY port exposed to the internet
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

volumes:
  mongo-data:

# ---------------- Custom bridge networks ----------------
networks:
  # Public side: only the NGINX container is attached
  frontend_net:
    name: expense_frontend_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # Private side: backend <-> mongo. "internal" = no outbound internet, not reachable from outside
  backend_net:
    name: expense_backend_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
